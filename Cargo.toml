[workspace]
resolver = "3"
members = [".", "crates/yy-encoding"]

[workspace.lints.rust]
unsafe_code = "deny"

[package]
name = "yysort"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ykwyuta/YYSort"

description = "Bounded external record sorting for fixed files and RFC 4180 CSV"

[dependencies]
yy-encoding = { path = "crates/yy-encoding" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rayon = "1.10"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_ProcessStatus"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
